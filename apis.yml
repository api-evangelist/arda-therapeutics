name: Arda Therapeutics
description: Arda Therapeutics is a San Carlos, California biotech company founded in
  2021 that develops targeted cell depletion therapies for chronic disease. Rather than
  modulating the proteins that pathogenic cells produce, Arda uses a single-cell sequencing
  and computational discovery engine to map disease-specific cell states, identify surface
  markers on harmful cells, and design targeted biologics that selectively deplete them
  across fibrotic, autoimmune, and metabolic conditions. Backed by a $43M Series A led
  by a16z Bio + Health with GV, Two Sigma Ventures, Eli Lilly and others. This API
  Evangelist profile tracks the company's public developer and web surface; Arda currently
  publishes a corporate marketing site with no public developer API.
